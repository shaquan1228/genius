[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genius-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["inspect-ai==0.3.278", "inspect-swe==0.2.71"]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "radon==6.0.1",
  "ruff==0.17.0",
  "xenon==0.9.3",
]

[tool.setuptools.packages.find]
include = ["genius_evals*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["genius_evals", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["genius_evals", "tests"]

[tool.coverage.report]
fail_under = 100
show_missing = true
