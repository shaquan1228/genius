[[case]]
skill = "reasoning"
id = "clear-task"
fixture = "receipt"
scope = ["receipt.py"]
prompt = "Fix total in receipt.py so each item's quantity contributes to the total. Change only receipt.py. Verify with python3 -I -B test_receipt.py. Complete the change and summarize it."
edits = [
  { path = "receipt.py", old = "sum(price for", new = "sum(price * quantity for" },
]
completion = "Each quantity now contributes to the total."
check = '''
import runpy

total = runpy.run_path("receipt.py")["total"]
assert total([]) == 0
assert total([(3.0, 4)]) == 12.0
assert total([(3.0, 0)]) == 0.0
assert total([(2.0, 3), (4.0, 2)]) == 14.0
assert total([(1.5, 2)]) == 3.0
'''

[[case]]
skill = "preflight"
id = "known-preflight"
fixture = "timeout"
scope = ["config.py", "client.py"]
prompt = "On branch eval, change the default timeout from 15 to 30 seconds in config.py and client.py. Only those two files are in scope. Keep tests and other behavior unchanged. Deliver the diff and a brief summary. Verify with python3 -I -B test_client.py. Complete the change."
edits = [
  { path = "config.py", old = "= 15", new = "= 30" },
  { path = "client.py", old = "= 15", new = "= 30" },
]
completion = "Updated both defaults and preserved overrides."
check = '''
import runpy

config = runpy.run_path("config.py")
client = runpy.run_path("client.py")
assert config["timeout_seconds"] == 30
assert client["fallback_timeout"] == 30
assert client["timeout"]() == 30
assert client["timeout"](5) == 5
assert client["timeout"](1) == 1
for value in (0, -1):
    try:
        client["timeout"](value)
    except ValueError:
        pass
    else:
        raise AssertionError("nonpositive timeout accepted")
'''

[[case]]
