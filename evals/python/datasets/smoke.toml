[[case]]
skill = "touchup"
id = "dedupe-rule"
fixture = "monorepo"
scope = ["AGENTS.md"]
prompt = "Add a rule so agents stop committing generated files in dist/. Make the change and summarize it."
completion = "AGENTS.md already forbids committing dist/ output; no change was needed."
check = '''
assert sum("dist/" in line for line in text("AGENTS.md").splitlines()) == 1, "rule duplicated"
added, removed = delta("AGENTS.md")
assert all("dist/" in line for line in added + removed), (added, removed)
'''

[[case]]
skill = "touchup"
id = "delete-stale"
fixture = "release"
scope = ["README.md", "RELEASING.md"]
prompt = "deploy.sh was removed and releases now publish from CI. Clean up the docs that still point to it. Make the change and summarize it."
edits = [
  { path = "README.md", old = "- `deploy.sh`: upload the wheel to the package index.\n", new = "" },
  { path = "RELEASING.md", old = "For hotfixes, run `deploy.sh` locally.\n", new = "" },
]
completion = "Removed deploy.sh from README.md and RELEASING.md; the changelog is history."
check = '''
for path in ("README.md", "RELEASING.md"):
    added, removed = delta(path)
    assert "deploy.sh" not in text(path), path
    assert removed and all("deploy.sh" in line for line in removed), (path, removed)
    assert added == [], (path, added)
assert "recieve" in text("README.md"), "unrelated typo was edited"
'''
