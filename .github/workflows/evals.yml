name: Evals

on:
  push:
    branches: [main]
    paths: ["evals/**", "docs/**", "skills/**", ".github/workflows/evals.yml"]
  pull_request:
    paths: ["evals/**", "docs/**", "skills/**", ".github/workflows/evals.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check on the hosted runtime
    runs-on: ubuntu-24.04
    # The Hugging Face Job image, so Python and native build tools match hosted runs.
    container: ghcr.io/astral-sh/uv:python3.12-bookworm
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git make build-essential
      - uses: actions/checkout@v4
      - name: Check setup and Python
        run: make -C evals check-scaffolding check-python

  installation:
    name: External installation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project evals --python 3.12 --locked --inexact
      - run: make -C evals check-install
