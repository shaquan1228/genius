name: Genius evals

on:
  pull_request:
    paths: ["evals/**", "docs/**", "skills/**", ".github/workflows/evals.yml"]
  push:
    branches: [main]
    paths: ["evals/**", "docs/**", "skills/**", ".github/workflows/evals.yml"]
  workflow_dispatch:
    inputs:
      agent:
        description: Coding agent
        type: choice
        options: [claude, codex]
        default: claude
        required: true
      model:
        description: Exact Inspect provider/model ID
        type: string
        required: true
      version:
        description: Exact CLI version (Claude 2.1.278 or Codex 0.137.0)
        type: string
        required: true
      epochs:
        description: Repeats per task and profile
        type: number
        default: 5
        required: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: make -C evals check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-quality
          path: evals/results/

  comparisons:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_AGENT: ${{ inputs.agent }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_VERSION: ${{ inputs.version }}
      EVAL_EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project evals --locked
      - name: Compare baseline and Genius
        run: |
          uv run --project evals inspect eval evals/tasks.py \
            --model "$EVAL_MODEL" -T "agent=$EVAL_AGENT" -T "version=$EVAL_VERSION" \
            --epochs "$EVAL_EPOCHS" --max-samples 1 --log-dir evals/results/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-comparisons
          path: evals/results/live/
