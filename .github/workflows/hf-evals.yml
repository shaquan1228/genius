name: HF evals

# Paid: each run launches a Hugging Face Job. Only users with write access can dispatch it.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact Inspect provider/model ID, for example hf-inference-providers/openai/gpt-oss-20b:nscale
        default: hf-inference-providers/openai/gpt-oss-20b:nscale
        required: true
        type: string
      dataset:
        description: Dataset adapter name
        type: string
        default: smoke
      limit:
        description: Optional number of problems per profile (empty runs all)
        type: string
        default: ""
      job_timeout:
        description: Hugging Face Job timeout
        type: string
        default: 4h
      max_samples:
        description: Concurrent samples (1 to 16; profiles remain serial)
        default: "1"
        type: string
      cost_limit:
        description: Maximum model USD per sample (checked after each response)
        default: "0.25"
        type: string
      model_cost:
        description: Exact routed provider USD per million tokens JSON (input, output, input_cache_write, input_cache_read)
        default: ""
        type: string
      epochs:
        description: Epochs per problem and profile (1 is one independent attempt)
        required: true
        default: "1"
        type: string
      agent:
        description: Agent override, claude or codex (empty selects by model)
        required: false
        default: ""
        type: string
      version:
        description: Agent version override (empty uses the pinned default)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: hf-evals
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/evals.yml

  launch:
    name: Run Hugging Face evaluation
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the Job and check its result
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE || github.repository_owner }}
          EVAL_MODEL: ${{ inputs.model }}
          EVAL_DATASET: ${{ inputs.dataset }}
          EVAL_LIMIT: ${{ inputs.limit }}
          EVAL_JOB_TIMEOUT: ${{ inputs.job_timeout }}
          EVAL_MAX_SAMPLES: ${{ inputs.max_samples }}
          EVAL_COST_LIMIT: ${{ inputs.cost_limit }}
          EVAL_MODEL_COST: ${{ inputs.model_cost }}
          EVAL_EPOCHS: ${{ inputs.epochs }}
          EVAL_AGENT: ${{ inputs.agent }}
          EVAL_VERSION: ${{ inputs.version }}
        run: |
          test -n "$HF_TOKEN" || { echo "Add an HF_TOKEN repository secret with write access." >&2; exit 1; }
          sh evals/bin/hf_host.sh
