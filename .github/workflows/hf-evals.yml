name: HF evals

# Paid: each new variant launches a Hugging Face Job. Dispatch requires write access.
on:
  pull_request_target:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      comparison_request:
        description: Optional comparison request JSON (uses variant refs and saved run references)
        type: string
        default: ""
      control_ref:
        description: Control instruction commit (empty uses main)
        type: string
        default: ""
      treatment_ref:
        description: Treatment instruction commit (empty uses dispatch commit)
        type: string
        default: ""
      model:
        description: Exact Inspect provider/model ID, for example hf-inference-providers/openai/gpt-oss-20b:nscale
        default: hf-inference-providers/openai/gpt-oss-20b:nscale
        required: true
        type: string
      dataset:
        description: Dataset adapter name
        type: string
        default: smoke
      limit:
        description: Optional number of problems per profile (empty runs all)
        type: string
        default: ""
      job_timeout:
        description: Hugging Face Job timeout
        type: string
        default: 4h
      max_samples:
        description: Concurrent samples per HF job (1 to 16)
        default: "1"
        type: string
      cost_limit:
        description: Maximum model USD per sample (checked after each response)
        default: "0.25"
        type: string
      model_cost:
        description: Exact routed provider USD per million tokens JSON (input, output, input_cache_write, input_cache_read)
        default: ""
        type: string
      epochs:
        description: Epochs per problem and profile (1 is one independent attempt)
        required: true
        default: "1"
        type: string
      agent:
        description: Agent override, claude or codex (empty selects by model)
        required: false
        default: ""
        type: string
      version:
        description: Agent version override (empty uses the pinned default)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: hf-evals
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'benchmark')
    uses: ./.github/workflows/evals.yml

  launch:
    needs: check
    name: Benchmark comparison
    permissions:
      contents: read
      checks: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'benchmark') &&
       (github.event.action == 'synchronize' || github.event.label.name == 'benchmark'))
    runs-on: ubuntu-24.04
    steps:
      - name: Authorize paid dispatch
        id: authorize
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: context.actor
            });
            if (!['admin', 'maintain', 'write'].includes(result.data.permission)) {
              core.setFailed('Paid benchmarks require repository write access.');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Fetch instruction objects as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            git fetch origin "refs/pull/$PR_NUMBER/head"
            git cat-file -e "$PR_BASE^{commit}"
            git cat-file -e "$PR_HEAD^{commit}"
          fi
      - name: Set up trusted harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y opam build-essential pkg-config ocaml-nox rsync
          uv sync --project evals --locked --inexact
          sh evals/bin/kernel_setup.sh
      - name: Prepare and run comparison
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_NAMESPACE: ${{ vars.HF_NAMESPACE || github.repository_owner }}
          EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'hf-inference-providers/openai/gpt-oss-20b:nscale' }}
          EVAL_DATASET: ${{ inputs.dataset || 'smoke' }}
          EVAL_LIMIT: ${{ inputs.limit }}
          EVAL_JOB_TIMEOUT: ${{ inputs.job_timeout || '4h' }}
          EVAL_MAX_SAMPLES: ${{ inputs.max_samples || '1' }}
          EVAL_COST_LIMIT: ${{ inputs.cost_limit || '0.25' }}
          EVAL_MODEL_COST: ${{ inputs.model_cost || vars.EVAL_MODEL_COST }}
          EVAL_EPOCHS: ${{ inputs.epochs || '1' }}
          EVAL_AGENT: ${{ inputs.agent }}
          EVAL_VERSION: ${{ inputs.version }}
          CONTROL_REF: ${{ github.event.pull_request.base.sha || inputs.control_ref || 'origin/main' }}
          TREATMENT_REF: ${{ github.event.pull_request.head.sha || inputs.treatment_ref || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMPARISON_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          COMPARISON_REQUEST: ${{ inputs.comparison_request }}
        run: |
          opam exec --switch=genius-kernel-414 -- uv run --project evals --no-sync python -m evals.python.integrations.hugging_face.compare --output evals/reports/comparison
      - name: Publish job summary
        if: always()
        run: |
          if [ -f evals/reports/comparison/summary.md ]; then
            cat evals/reports/comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-comparison
          path: evals/reports/comparison
      - name: Publish PR benchmark check
        if: >-
          always() && steps.authorize.outcome == 'success' &&
          github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const root = 'evals/reports/comparison';
            const report = fs.existsSync(`${root}/comparison.json`)
              ? JSON.parse(fs.readFileSync(`${root}/comparison.json`, 'utf8'))
              : {};
            const verdict = report.comparisons?.treatment?.verdict || 'failed';
            const summary = fs.existsSync(`${root}/summary.md`)
              ? fs.readFileSync(`${root}/summary.md`, 'utf8')
              : 'Comparison did not complete. See the workflow logs.';
            const conclusion = {
              improved: 'success', inconclusive: 'neutral', regressed: 'failure'
            }[verdict] || 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Benchmark comparison',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed', conclusion,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: { title: `Benchmark: ${verdict}`, summary: summary.slice(0, 60000) }
            });
